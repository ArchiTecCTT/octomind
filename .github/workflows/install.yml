name: Install

# Installs the latest published release through install.ps1 and the Scoop
# manifest, so changes to either are checked on a real Windows host.
on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop, 'bench/**' ]
    paths:
      - install.ps1
      - scoop/**
      - .github/workflows/install.yml
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - install.ps1
      - scoop/**
      - .github/workflows/install.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-ps1:
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (stock Windows), pwsh = PowerShell 7
        shell: [ powershell, pwsh ]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Authenticates the release lookup so shared runner IPs don't hit the API rate limit
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run install.ps1
      run: |
        $PSVersionTable.PSVersion
        Get-Content -Raw ./install.ps1 | Invoke-Expression
        octomind --version

    # Each step starts from the runner's environment, not the registry, so
    # rebuild PATH the way a new login shell would to prove the user PATH entry.
    - name: octomind --version in a fresh shell
      run: |
        $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
        (Get-Command octomind).Source
        octomind --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Pinned version into a relative install dir
      run: |
        $env:OCTOMIND_VERSION = '0.58.4'
        $env:OCTOMIND_INSTALL_DIR = 'pinned-bin'
        Get-Content -Raw ./install.ps1 | Invoke-Expression
        $expected = Join-Path $PWD 'pinned-bin'
        $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
        $userPath
        if (-not (($userPath -split ';') -contains $expected)) { throw "absolute $expected missing from user PATH" }
        if (($userPath -split ';') -contains 'pinned-bin') { throw 'relative entry written to user PATH' }
        & "$expected\octomind.exe" --version
        # Re-running must not duplicate the PATH entry
        Get-Content -Raw ./install.ps1 | Invoke-Expression
        $count = @((Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ -eq $expected }).Count
        if ($count -ne 1) { throw "expected one PATH entry, found $count" }

  scoop:
    name: Scoop manifest
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Scoop
      run: |
        Invoke-RestMethod https://get.scoop.sh -OutFile install-scoop.ps1
        # Hosted runners run as administrator, which Scoop refuses without -RunAsAdmin
        ./install-scoop.ps1 -RunAsAdmin
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"

    - name: scoop install from scoop/octomind.json
      run: |
        # A relative path reads as <bucket>/<app>; an absolute one is a local manifest
        scoop install "$PWD\scoop\octomind.json"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        octomind --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
